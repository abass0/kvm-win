---
all:
  children:
    kvm_hosts:
      hosts:
        fedora-kvm:
          ansible_host: 192.168.1.100  # Replace with your Fedora KVM host IP or hostname
          ansible_user: your_user      # Replace with your SSH user
          ansible_python_interpreter: /usr/bin/python3

    # localhost is used by the AWS playbook (API calls run on the controller)
    local:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
