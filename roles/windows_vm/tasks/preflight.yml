---
- name: Check that libvirtd service is running
  ansible.builtin.service_facts:

- name: Fail if libvirtd is not running
  ansible.builtin.assert:
    that:
      - "'libvirtd.service' in ansible_facts.services"
      - "ansible_facts.services['libvirtd.service'].state == 'running'"
    fail_msg: >-
      libvirtd is not running on {{ inventory_hostname }}.
      Ensure libvirt is installed and the service is started.
    quiet: true

- name: Check that the storage pool exists and is active
  # No Ansible module provides storage pool inspection; virsh is required.
  ansible.builtin.command:
    cmd: virsh pool-info {{ vm_storage_pool }}
  register: pool_info
  changed_when: false
  failed_when: pool_info.rc != 0

- name: Fail if the storage pool is not active
  ansible.builtin.assert:
    that:
      - "'running' in pool_info.stdout or 'active' in pool_info.stdout"
    fail_msg: >-
      Storage pool '{{ vm_storage_pool }}' exists but is not active.
      Start it with: virsh pool-start {{ vm_storage_pool }}
    quiet: true

- name: Check that the Windows ISO exists on the KVM host
  ansible.builtin.stat:
    path: "{{ windows_iso }}"
  register: windows_iso_stat

- name: Fail if the Windows ISO does not exist
  ansible.builtin.assert:
    that:
      - windows_iso_stat.stat.exists
    fail_msg: >-
      Windows ISO not found at '{{ windows_iso }}' on {{ inventory_hostname }}.
      Upload the ISO to the KVM host before running provisioning.
    quiet: true

- name: Check that the VirtIO ISO exists on the KVM host
  ansible.builtin.stat:
    path: "{{ virtio_iso }}"
  register: virtio_iso_stat
  when: virtio_iso is defined and virtio_iso | length > 0

- name: Fail if the VirtIO ISO does not exist
  ansible.builtin.assert:
    that:
      - virtio_iso_stat.stat.exists
    fail_msg: >-
      VirtIO ISO not found at '{{ virtio_iso }}' on {{ inventory_hostname }}.
      Download it from https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/
    quiet: true
  when: virtio_iso is defined and virtio_iso | length > 0
