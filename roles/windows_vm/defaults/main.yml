---
# VM identity
vm_name: "windows-vm"

# VM resources
vm_memory: 4096       # Memory in MiB
vm_vcpus: 2           # Number of virtual CPUs
vm_disk_size: "60G"   # Disk size (qemu-img format: 60G, 100G, etc.)

# Storage
vm_storage_pool: "default"
vm_disk_dir: "/var/lib/libvirt/images"

# Installation media
windows_iso: "/var/lib/libvirt/images/iso/windows.iso"
virtio_iso: "/var/lib/libvirt/images/iso/virtio-win.iso"

# Network
vm_network: "default"
vm_network_model: "virtio"

# VM hardware
vm_os_variant: "win10"
vm_machine_type: "q35"
vm_firmware: "bios"  # "bios" or "uefi"
vm_uefi_loader: "/usr/share/edk2/ovmf/OVMF_CODE.fd"

# Boot order
vm_boot_cdrom_first: true

# Computed paths (do not override unless you use a non-standard pool layout)
vm_disk_path: "{{ vm_disk_dir }}/{{ vm_name }}.qcow2"
