---
- name: Validate that aws_instance_name is defined and not empty
  ansible.builtin.assert:
    that:
      - aws_instance_name is defined
      - aws_instance_name | length > 0
    fail_msg: "aws_instance_name must be defined and not empty."
    quiet: true

- name: Validate that aws_region is defined
  ansible.builtin.assert:
    that:
      - aws_region is defined
      - aws_region | length > 0
    fail_msg: "aws_region must be defined."
    quiet: true

- name: Validate that aws_instance_type is defined
  ansible.builtin.assert:
    that:
      - aws_instance_type is defined
      - aws_instance_type | length > 0
    fail_msg: "aws_instance_type must be defined."
    quiet: true

- name: Validate that aws_key_name is defined
  ansible.builtin.assert:
    that:
      - aws_key_name is defined
      - aws_key_name | length > 0
    fail_msg: "aws_key_name must be defined. Create a key pair in the AWS console first."
    quiet: true

- name: Validate that aws_root_volume_size is a positive integer
  ansible.builtin.assert:
    that:
      - aws_root_volume_size | int > 0
    fail_msg: "aws_root_volume_size must be a positive integer (GB). Got: '{{ aws_root_volume_size }}'."
    quiet: true

- name: Validate that aws_security_group_name is defined
  ansible.builtin.assert:
    that:
      - aws_security_group_name is defined
      - aws_security_group_name | length > 0
    fail_msg: "aws_security_group_name must be defined."
    quiet: true
