---
- name: Resolve the VPC ID
  amazon.aws.ec2_vpc_net_info:
    region: "{{ aws_region }}"
    filters:
      isDefault: "true"
  register: default_vpc_info
  when: aws_vpc_id | length == 0

- name: Set VPC ID from default VPC
  ansible.builtin.set_fact:
    resolved_vpc_id: "{{ default_vpc_info.vpcs[0].vpc_id }}"
  when: aws_vpc_id | length == 0

- name: Use the explicitly provided VPC ID
  ansible.builtin.set_fact:
    resolved_vpc_id: "{{ aws_vpc_id }}"
  when: aws_vpc_id | length > 0

- name: Fail if no VPC was resolved
  ansible.builtin.assert:
    that:
      - resolved_vpc_id is defined
      - resolved_vpc_id | length > 0
    fail_msg: >-
      Could not resolve a VPC. Either set aws_vpc_id explicitly or ensure
      a default VPC exists in region '{{ aws_region }}'.
    quiet: true

- name: Initialize security group rules
  ansible.builtin.set_fact:
    sg_rules: []

- name: Add RDP rules
  ansible.builtin.set_fact:
    sg_rules: "{{ sg_rules + [rdp_entry] }}"
  loop: "{{ aws_allowed_rdp_cidrs }}"
  vars:
    rdp_entry:
      proto: tcp
      from_port: 3389
      to_port: 3389
      cidr_ip: "{{ item }}"
      rule_desc: RDP

- name: Add WinRM rules
  ansible.builtin.set_fact:
    sg_rules: "{{ sg_rules + [winrm_entry] }}"
  loop: "{{ aws_allowed_winrm_cidrs }}"
  vars:
    winrm_entry:
      proto: tcp
      from_port: 5986
      to_port: 5986
      cidr_ip: "{{ item }}"
      rule_desc: WinRM HTTPS
  when: aws_allowed_winrm_cidrs | length > 0

- name: Create security group for the Windows instance
  amazon.aws.ec2_security_group:
    name: "{{ aws_security_group_name }}"
    description: "Security group for Windows VM {{ aws_instance_name }}"
    vpc_id: "{{ resolved_vpc_id }}"
    region: "{{ aws_region }}"
    rules: "{{ sg_rules }}"
    tags: "{{ aws_tags | combine({'Name': aws_security_group_name}) }}"
    state: present
  register: sg_result
