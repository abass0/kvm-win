---
- name: Check if the instance already exists
  amazon.aws.ec2_instance_info:
    region: "{{ aws_region }}"
    filters:
      "tag:Name": "{{ aws_instance_name }}"
      instance-state-name:
        - pending
        - running
        - stopping
        - stopped
  register: existing_instances

- name: Set instance existence fact
  ansible.builtin.set_fact:
    instance_already_exists: "{{ existing_instances.instances | length > 0 }}"

- name: Report that instance already exists
  ansible.builtin.debug:
    msg: >-
      Instance '{{ aws_instance_name }}' already exists
      ({{ existing_instances.instances[0].instance_id }},
      state: {{ existing_instances.instances[0].state.name }}).
      Skipping creation. No destructive action will be taken.
  when: instance_already_exists

- name: Set existing instance facts
  ansible.builtin.set_fact:
    ec2_instance_id: "{{ existing_instances.instances[0].instance_id }}"
    ec2_instance_state: "{{ existing_instances.instances[0].state.name }}"
    ec2_public_ip: "{{ existing_instances.instances[0].public_ip_address | default('none') }}"
    ec2_private_ip: "{{ existing_instances.instances[0].private_ip_address | default('none') }}"
  when: instance_already_exists

- name: Launch the Windows EC2 instance
  amazon.aws.ec2_instance:
    name: "{{ aws_instance_name }}"
    region: "{{ aws_region }}"
    instance_type: "{{ aws_instance_type }}"
    image_id: "{{ resolved_ami_id }}"
    key_name: "{{ aws_key_name }}"
    security_groups:
      - "{{ sg_result.group_id }}"
    vpc_subnet_id: "{{ aws_subnet_id if aws_subnet_id | length > 0 else omit }}"
    # network.assign_public_ip is deprecated (removal 2026-12-01) but the
    # replacement (network_interfaces) requires vpc_subnet_id at top level
    # AND inside the interface spec, which the module does not yet support
    # cleanly. Revisit after amazon.aws collection updates the interface.
    network:
      assign_public_ip: "{{ aws_assign_public_ip }}"
    volumes:
      - device_name: /dev/sda1
        ebs:
          volume_size: "{{ aws_root_volume_size }}"
          volume_type: "{{ aws_root_volume_type }}"
          delete_on_termination: true
    metadata_options:
      http_tokens: "{{ aws_instance_metadata_http_tokens }}"
    user_data: "{{ aws_user_data if aws_user_data | length > 0 else omit }}"
    tags: "{{ aws_tags | combine({'Name': aws_instance_name}) }}"
    wait: true
    state: running
  register: ec2_result
  when: not instance_already_exists

- name: Set new instance facts
  ansible.builtin.set_fact:
    ec2_instance_id: "{{ ec2_result.instances[0].instance_id }}"
    ec2_instance_state: "{{ ec2_result.instances[0].state.name }}"
    ec2_public_ip: "{{ ec2_result.instances[0].public_ip_address | default('none') }}"
    ec2_private_ip: "{{ ec2_result.instances[0].private_ip_address | default('none') }}"
  when: not instance_already_exists
