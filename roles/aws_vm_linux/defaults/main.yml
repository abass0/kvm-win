---
# Instance identity
aws_instance_name: "linux-vm"

# AWS region
aws_region: "us-east-2"

# Instance type
aws_instance_type: "t3.medium"

# AMI — set to a specific AMI ID, or leave empty to auto-discover
aws_ami_id: ""

# AMI lookup filters (used when aws_ami_id is empty)
aws_ami_owner: "amazon"
aws_ami_name_filter: "al2023-ami-*-x86_64"

# Key pair — must already exist in the AWS account
aws_key_name: "my-keypair"

# Networking — leave empty to use the default VPC and subnet
aws_vpc_id: ""
aws_subnet_id: ""

# Security group
aws_security_group_name: "linux-vm-sg"
aws_allowed_ssh_cidrs:
  - "0.0.0.0/0"

# Storage
aws_root_volume_size: 30
aws_root_volume_type: "gp3"

# Tags applied to every resource
aws_tags: {}

# Public IP
aws_assign_public_ip: true

# Instance metadata
aws_instance_metadata_http_tokens: "required"

# User data script (leave empty for no user data)
aws_user_data: ""
