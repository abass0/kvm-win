---
- name: Display AWS Linux provisioning summary
  ansible.builtin.debug:
    msg: |
      ========================================
       AWS Linux VM Provisioning Summary
      ========================================
       Instance Name:   {{ aws_instance_name }}
       Instance ID:     {{ ec2_instance_id }}
       State:           {{ ec2_instance_state }}
       Already Existed: {{ instance_already_exists }}
      ----------------------------------------
       Instance Type:   {{ aws_instance_type }}
       AMI:             {{ resolved_ami_id }}
       Region:          {{ aws_region }}
      ----------------------------------------
       Public IP:       {{ ec2_public_ip }}
       Private IP:      {{ ec2_private_ip }}
       Key Pair:        {{ aws_key_name }}
       Security Group:  {{ aws_security_group_name }}
      ----------------------------------------
       Root Volume:     {{ aws_root_volume_size }} GB ({{ aws_root_volume_type }})
      ========================================
      {% if instance_already_exists %}
       NOTE: Instance already existed. No changes were made.
      {% else %}
       Instance created and running.
       Connect via SSH:
         ssh -i /path/to/{{ aws_key_name }}.pem ec2-user@{{ ec2_public_ip }}
      {% endif %}
      ========================================
