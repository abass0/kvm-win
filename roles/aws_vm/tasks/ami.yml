---
- name: Look up the latest AMI
  amazon.aws.ec2_ami_info:
    region: "{{ aws_region }}"
    owners:
      - "{{ aws_ami_owner }}"
    filters:
      name: "{{ aws_ami_name_filter }}"
      state: "available"
  register: ami_lookup
  when: aws_ami_id | length == 0

- name: Select the most recent AMI from the lookup
  ansible.builtin.set_fact:
    resolved_ami_id: >-
      {{ (ami_lookup.images
          | sort(attribute='creation_date')
          | last).image_id }}
  when: aws_ami_id | length == 0

- name: Use the explicitly provided AMI ID
  ansible.builtin.set_fact:
    resolved_ami_id: "{{ aws_ami_id }}"
  when: aws_ami_id | length > 0

- name: Fail if no AMI was resolved
  ansible.builtin.assert:
    that:
      - resolved_ami_id is defined
      - resolved_ami_id | length > 0
    fail_msg: >-
      Could not resolve an AMI. Either set aws_ami_id explicitly
      or verify that the filter '{{ aws_ami_name_filter }}'
      returns results in region '{{ aws_region }}'.
    quiet: true

- name: Report selected AMI
  ansible.builtin.debug:
    msg: "Using AMI: {{ resolved_ami_id }}"
