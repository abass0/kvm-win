---
- name: Resolve the VPC ID
  amazon.aws.ec2_vpc_net_info:
    region: "{{ aws_region }}"
    filters:
      isDefault: "true"
  register: default_vpc_info
  when: aws_vpc_id | length == 0

- name: Set VPC ID from default VPC
  ansible.builtin.set_fact:
    resolved_vpc_id: "{{ default_vpc_info.vpcs[0].vpc_id }}"
  when: aws_vpc_id | length == 0

- name: Use the explicitly provided VPC ID
  ansible.builtin.set_fact:
    resolved_vpc_id: "{{ aws_vpc_id }}"
  when: aws_vpc_id | length > 0

- name: Fail if no VPC was resolved
  ansible.builtin.assert:
    that:
      - resolved_vpc_id is defined
      - resolved_vpc_id | length > 0
    fail_msg: >-
      Could not resolve a VPC. Either set aws_vpc_id explicitly
      or ensure a default VPC exists in region '{{ aws_region }}'.
    quiet: true
