---
- name: Check if VM already exists
  community.libvirt.virt:
    command: list_vms
  register: existing_vms

- name: Set VM existence fact
  ansible.builtin.set_fact:
    vm_already_exists: "{{ vm_name in existing_vms.list_vms }}"

- name: Report that VM already exists
  ansible.builtin.debug:
    msg: >-
      VM '{{ vm_name }}' already exists on
      {{ inventory_hostname }}. Skipping creation.
      No destructive action will be taken.
  when: vm_already_exists

- name: Create VM disk
  ansible.builtin.command:
    cmd: >-
      qemu-img create -f qcow2
      {{ vm_disk_path }} {{ vm_disk_size }}
    creates: "{{ vm_disk_path }}"
  when: not vm_already_exists

- name: Define the VM in libvirt
  community.libvirt.virt:
    command: define
    xml: "{{ lookup('template', 'vm.xml.j2') }}"
  when: not vm_already_exists

- name: Start the VM
  community.libvirt.virt:
    name: "{{ vm_name }}"
    state: running
  when: not vm_already_exists

- name: Verify the VM is running
  community.libvirt.virt:
    command: status
    name: "{{ vm_name }}"
  register: vm_status

- name: Fail if VM is not running
  ansible.builtin.assert:
    that:
      - vm_status.status == 'running'
    fail_msg: >-
      VM '{{ vm_name }}' was created but is not running.
      Check libvirt logs.
    quiet: true
  when: not vm_already_exists
